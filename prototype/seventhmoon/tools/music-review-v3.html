<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일곱 번째 달 · 새 음악 듣기</title><base href="../">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#15131d;color:#eee8df}*{box-sizing:border-box}body{margin:0 auto;max-width:1120px;padding:28px 22px 70px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0 12px}h2{font-size:20px;margin:36px 0 14px}p{color:#bcb3c8;line-height:1.7}.eyebrow{font-size:12px;color:#d9b77f;letter-spacing:.18em}a{color:#e5c996}button{font:inherit;color:#eee8df;background:#30263d;border:1px solid #655473;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:#ddbd88;color:#231c29}header{margin-bottom:22px}.player{position:sticky;top:0;z-index:2;background:#211d2cf5;border:1px solid #594b63;border-radius:14px;padding:17px;backdrop-filter:blur(12px)}.player strong{display:block;margin-bottom:10px}audio{width:100%;height:42px;margin-bottom:10px}.switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.switch small{margin-left:auto;color:#bcb3c8}#status{font-size:13px;min-height:20px;color:#d9c6a6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}.track{background:#211d2c;border:1px solid #41394d;border-radius:12px;padding:17px}.track h3{font-size:16px;margin:0 0 7px}.track p{font-size:13px;min-height:44px;margin:0 0 14px}.track button{width:100%;text-align:left}.track small{color:#b5a8bd}footer{margin-top:32px;font-size:13px}.pending{padding:25px}</style></head>
<body><header><div class="eyebrow">SEVENTH MOON / MUSIC V3</div><h1>장면에 어울리는 새 음악</h1><p>현악·피아노·목관과 손북을 중심으로 다시 편곡했습니다.<br>곡을 선택한 뒤 이전 음악과 번갈아 들어볼 수 있어요.</p></header>
<section class="player" aria-label="음악 플레이어"><strong id="playing">들을 곡을 골라 주세요</strong><audio id="audio" controls preload="none"></audio><div class="switch"><button id="new" aria-pressed="true">새 편곡</button><button id="old" aria-pressed="false">이전 편곡</button><label><input id="loop" type="checkbox" checked> 반복</label><small id="version"></small></div><p id="status" role="status">곡 목록을 불러오는 중…</p></section>
<main id="tracks" class="pending"></main><footer><a href="./">게임으로 돌아가기</a> · <a href="docs/music-v3-handoff.txt">작업 메모</a> · <a href="docs/music-v3-credits.txt">악기 음원 출처</a><p>보컬·가사 없는 연주곡입니다. 음악은 녹음된 개별 악기 샘플을 직접 편곡해 제작했습니다.</p></footer>
<script>
const sections=[['공통',[['title','타이틀','호른 테마와 넓게 펼쳐지는 현악'],['camp','캐러밴 캠프','따뜻한 플루트와 부드러운 어쿠스틱'],['map','여행 지도','가벼운 현악과 뜯는 현의 발걸음'],['tower_a','심연의 탑 I','낮은 첼로와 긴장감 있는 타악'],['tower_b','심연의 탑 II','한층 무거운 호른과 현악 리듬']]],['스테이지',[['c1_forest','숲 가도','플루트·뜯는 현·손북의 모험'],['c1_village','불타는 마을','긴박하게 몰아치는 현악'],['c1_swamp','안개 늪','숨을 고르는 목관과 안개 같은 잔향'],['c2_harbor','항구','바이올린과 경쾌한 손북'],['c2_sewer','하수도','은밀한 현과 엇박 리듬'],['c3_desert','사막 신전','선법 선율과 다르부카'],['c3_tomb','지하 묘실','첼로와 낮은 의식의 리듬'],['c4_frost','설산 고개','맑은 피아노와 차분한 현악'],['c4_dwarf','드워프 요새','묵직한 호른과 북'],['c5_tower','마도탑','하프와 교차하는 현악'],['c6_abyss','흑월의 심연','저음 현악과 깊은 타악']]],['보스',[['boss_mid','중간 보스','첼로의 긴장과 타악'],['boss_a','챕터 보스 I','호른 선율과 전투의 추진력'],['boss_b','챕터 보스 II','두꺼운 현악과 거대한 북'],['boss_orvex','오르벡스','주제 선율의 비극적인 첼로 변주'],['boss_azmal','아즈말','호른·현악·대북의 대결'],['boss_azmal_rage','아즈말 광폭화','빨라지는 현악과 타악'],['boss_void','공허의 그림자','차가운 피아노와 흔들리는 화성']]],['이야기와 엔딩',[['story_lise','리세의 테마','조용한 피아노와 희망의 선율'],['story_orvex','오르벡스의 기억','가까운 바이올린과 긴 여운'],['story_tension','긴장','선율을 비운 저음의 호흡'],['end_seal','봉인 엔딩','절제된 호른과 아쉬운 여운'],['end_true','진 엔딩','밝게 돌아오는 호른 주제'],['end_dark','다크 엔딩','무거운 첼로와 어두운 화성'],['end_sacrifice','희생 엔딩','단조로 돌아오는 리세의 피아노']]],['짧은 음악',[['stage_clear','스테이지 클리어','짧은 어쿠스틱 팡파르'],['chapter_clear','챕터 클리어','현악과 호른의 마무리'],['level_up','레벨업','피아노와 하프의 짧은 상승'],['legendary','전설 장비','부드럽게 열리는 화음'],['rank_s','S 등급','짧고 선명한 성취감'],['moonstone','월석','하프와 피아노의 여운'],['boss_warning','보스 경고','낮은 호른과 북'],['game_over','게임 오버','내려가는 피아노 선율']]]];
let manifest,selected=null,edition='new';const audio=document.querySelector('#audio'),status=document.querySelector('#status'),loop=document.querySelector('#loop');audio.volume=.65;
function select(id,title){selected={id,title};loop.checked=manifest.musicSettings[id].loop;play(false)}
function play(keep){if(!selected)return;const previous=keep?audio.currentTime:0;const file=edition==='new'?manifest.musicFiles[selected.id]:selected.id;audio.src='assets/audio/'+file+'.m4a?v='+encodeURIComponent(edition==='new'?manifest.musicVersion:'previous');audio.loop=loop.checked;document.querySelector('#playing').textContent=selected.title+' · '+(edition==='new'?'새 편곡':'이전 편곡');audio.onloadedmetadata=()=>{if(previous<audio.duration)audio.currentTime=previous};audio.play().catch(()=>{status.textContent='재생 버튼을 눌러 주세요.'});status.textContent='음악을 불러오는 중…'}
for(const key of ['new','old'])document.querySelector('#'+key).onclick=()=>{edition=key;for(const v of ['new','old'])document.querySelector('#'+v).setAttribute('aria-pressed',String(v===key));play(true)};
loop.onchange=()=>{audio.loop=loop.checked};
audio.onplaying=()=>{status.textContent='재생 중 · '+selected.title+' · '+(edition==='new'?'새 편곡':'이전 편곡')};audio.onpause=()=>{status.textContent='일시정지'};audio.onerror=()=>{status.textContent='음원을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.'};
fetch('assets/audio/manifest.json?review=music-v3',{cache:'no-cache'}).then(r=>r.json()).then(m=>{manifest=m;if(Object.keys(m.musicFiles||{}).length!==38)throw Error('Music not ready');document.querySelector('#version').textContent='BGM 30곡 · 짧은 음악 8개';const target=document.querySelector('#tracks');target.className='';for(const [title,list]of sections){const h=document.createElement('h2');h.textContent=title;target.append(h);const grid=document.createElement('div');grid.className='grid';for(const [key,label,desc]of list){const id=(title==='짧은 음악'?'jgl_':'bgm_')+key;const article=document.createElement('article');article.className='track';const h3=document.createElement('h3');h3.textContent=label;const p=document.createElement('p');p.textContent=desc;const button=document.createElement('button');const duration=m.musicSettings[id].duration;button.textContent='▶ 듣기 · '+Math.floor(duration/60)+':'+String(Math.round(duration%60)).padStart(2,'0');button.onclick=()=>select(id,label);article.append(h3,p,button);grid.append(article)}target.append(grid)}status.textContent='준비 완료 · 38곡 모두 새 편곡으로 연결됨'}).catch(()=>{status.textContent='곡 목록을 준비하지 못했어요. 새로고침해 주세요.'});
</script></body></html>
