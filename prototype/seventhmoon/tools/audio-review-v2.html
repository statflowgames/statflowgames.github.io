<!doctype html>
<html lang="ko"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일곱 번째 달 · 기합과 각성 소리</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#17151c;color:#f2e8d9}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:28px;margin:8px 0}p{color:#c8becd;line-height:1.6}section,.bar{border:1px solid #54435e;background:#251e2c;border-radius:12px;padding:16px;margin:16px 0}h2{font-size:20px;margin:0 0 9px}button,select,input{font:inherit}button,select{min-height:44px;padding:10px 14px;border:1px solid #796185;border-radius:7px;background:#382c40;color:#fff1df;margin:4px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.bar{position:sticky;top:0;z-index:5;box-shadow:0 8px 20px #0005}.primary{background:#dbb37d;color:#241c18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid section{margin:0}.tone{font-size:13px;color:#b8d9d0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}#status{font-size:13px;min-height:22px;color:#ebca98;margin:7px 0}a{color:#edc58f}@media(max-width:680px){main{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:24px}.bar{padding:10px}button{flex:1}section{padding:12px}}</style></head>
<body><main><p>SEVENTH MOON / CHARACTER AUDIO V5</p><h1>기합·각성·몬스터 소리</h1><p>쓰러질 때는 짧게 힘이 꺾이는 소리, 승리할 때는 짧고 자신감 있는 기합으로 맞췄습니다. 실제 대사 없는 소리만 사용합니다.</p>
<div class="bar"><div class="row"><button id="prepare" class="primary">소리 준비하기</button><button id="stop">정지</button><label>기합·괴성 음량 <input id="volume" aria-label="기합·괴성 음량" type="range" min="0" max="100" value="80"><span id="level">80%</span></label></div><p id="status" role="status">버튼을 눌러 음원을 준비해 주세요.</p></div>
<div class="grid" id="heroes"></div>
<section><h2>골드·달리기·일반 효과음</h2><p>반복되는 동작은 짧고 건조하게, 타격·방어는 선명하게 들리도록 맞췄습니다.</p><div class="row" id="foley"></div></section>
<section><h2>몬스터·보스</h2><p>피격·사망 소리를 더 크고 선명하게 조정했습니다. 보스 13명은 각자의 전용 소리를 사용합니다.</p><div class="row"><label>종류<select id="enemy"><optgroup label="일반 몬스터"><option value="grunt">그롤린</option><option value="mummy">미라</option><option value="skeleton_archer">해골</option><option value="wolf">늑대</option><option value="ratkin_blade">쥐족</option><option value="slime">점액</option><option value="scorpion">전갈·뱀</option><option value="construct">마도 병정·골렘</option><option value="harpy">하피·날개 괴물</option><option value="snow_brute">설산 야수</option><option value="shadow_knight">흑월 기사</option><option value="pirate">해적·광부</option><option value="wyvern_grunt">용 계열</option></optgroup><optgroup label="보스 전용 피격·사망"><option value="barkhaul">바크하울 · 나무와 거인의 숨</option><option value="toothcrusher">이빨부숴 · 거친 비명과 사슬</option><option value="captain_mog">모그 · 쇳소리와 신음</option><option value="gloob">글러브 · 무거운 점액</option><option value="twinsting">쌍침 · 갑각 파열</option><option value="sehera">세헤라 · 모래와 마른 신음</option><option value="frost_wyvern">서리 와이번 · 얼음과 짐승</option><option value="hrimgar">흐림가르 · 빙하 붕괴</option><option value="golem7">골렘 칠호 · 기계 정지</option><option value="orvex">오르벡스 · 마력 흩어짐</option><option value="orvex_eclipse">흑월 오르벡스 · 암흑 균열</option><option value="azmal">아즈말 · 용의 마지막 포효</option><option value="void_shadow">공허의 그림자 · 진공 붕괴</option></optgroup></select></label></div><div class="row" id="enemies"></div></section>
<p><a href="tools/ability-review.html?scene=abilityReview">실제 각성 동작과 비교</a> · <a href="docs/hero-emotion-v5-handoff.txt">작업 메모</a> · <a href="docs/hero-emotion-v4-credits.txt">원음 출처</a></p>
</main><script src="js/sfx.js?v=emotion5-52f836cad8"></script><script>
const cast={warrior:['하르반','낮고 든든한 가슴 기합'],mage:['미라엘','선명하고 자신만만한 짧은 기합'],paladin:['오델리아','따뜻하고 묵직한 힘'],rogue:['키르','가볍고 빠른 호흡'],ranger:['세릴','차분하고 부드러운 호흡'],hexblade:['녹타','낮고 절제된 힘']};
const state=document.getElementById('status'),scheduled=new Set();let ready=false;
const delay=(ms,fn)=>{const id=setTimeout(()=>{scheduled.delete(id);fn();},ms);scheduled.add(id);};
function stop(){for(const id of scheduled)clearTimeout(id);scheduled.clear();SFX.setVolume(0,0,0);state.textContent='정지';}
function begin(name){stop();SFX.setVolume(0,.8,+document.getElementById('volume').value/100);state.textContent=name+' 재생 중';}
for(const [hero,[name,tone]]of Object.entries(cast)){
 const s=document.createElement('section');s.innerHTML='<h2>'+name+'</h2><p class="tone">'+tone+'</p><div class="row"></div>';document.getElementById('heroes').append(s);
 const actions={
  '공격 4연타':()=>{[0,330,660,1020].forEach((at,i)=>delay(at,()=>{SFX.swing(i===3,640,'blade');SFX.heroAtk(i===3?2:i===2?1:0,640,hero);}));},
  '각성':()=>{SFX.awaken(hero,640);delay(440,()=>{
    SFX.awakenImpact(hero,640);
    if(hero==='mage')['fire','ice','bolt'].forEach((p,i)=>delay(300+i*280,()=>SFX.awakenImpact(hero,640,p)));
    if(hero==='rogue')for(let i=0;i<5;i++)delay(140*i,()=>SFX.awakenImpact(hero,640,'blink'));
    if(hero==='ranger')for(let i=0;i<12;i++)delay(100+90*i,()=>SFX.awakenImpact(hero,640,'arrow'));
    if(hero==='paladin')for(let i=1;i<4;i++)delay(700*i,()=>SFX.awakenImpact(hero,640,'pulse'));
  });},
  '피격':()=>SFX.heroHurt(640,hero),'쓰러짐 기합':()=>SFX.heroKO(640,hero),'승리 기합':()=>SFX.heroWin(hero)
 };
 for(const [label,fn]of Object.entries(actions)){const b=document.createElement('button');b.textContent=label;b.disabled=true;b.dataset.sound='1';b.onclick=()=>{if(ready){begin(name+' '+label);fn();}};s.querySelector('.row').append(b);}
}
for(const [kind,label]of Object.entries({atk:'공격',hurt:'피격',die:'사망',alert:'발견',chant:'주술',roar:'포효'})){
 const b=document.createElement('button');b.textContent=label;b.dataset.sound='1';b.disabled=true;b.onclick=()=>{begin('몬스터 '+label);SFX.gob(kind,640,1,document.getElementById('enemy').value);};document.getElementById('enemies').append(b);
}
for(const [label,fn]of Object.entries({
 '골드 10개':()=>{for(let i=0;i<10;i++)delay(i*90,()=>SFX.coin(640));},
 '갑옷 달리기':()=>{for(let i=0;i<14;i++)delay(i*190,()=>SFX.step('armor',640));},
 '가죽 달리기':()=>{for(let i=0;i<14;i++)delay(i*170,()=>SFX.step('leather',640));},
 '로브 달리기':()=>{for(let i=0;i<14;i++)delay(i*200,()=>SFX.step('robe',640));},
 '칼·타격':()=>{SFX.swing(false,640,'blade');delay(110,()=>SFX.hit(false,640));},
 '방어·패링':()=>{SFX.guard(640);delay(600,()=>SFX.parry(640));},
 '보물상자':()=>SFX.ui('chest_open'), 'UI 선택':()=>SFX.ui('ui_tap')
})){const b=document.createElement('button');b.textContent=label;b.dataset.sound='1';b.disabled=true;b.onclick=()=>{begin(label);fn();};document.getElementById('foley').append(b);}
document.getElementById('prepare').onclick=async()=>{state.textContent='음원 준비 중…';await SFX.resume();const d=SFX._debug();ready=d.ready&&d.voiceKeys===36&&d.enemyKeys>=130;if(ready){document.querySelectorAll('[data-sound]').forEach(b=>b.disabled=false);state.textContent='준비 완료 · 주인공 6명 / 몬스터 13계열 / 보스 전용 13명';document.getElementById('prepare').textContent='음원 준비 완료';}else state.textContent='음원을 불러오지 못했어요. 다시 눌러 주세요.';};
document.getElementById('stop').onclick=stop;document.getElementById('volume').oninput=e=>{document.getElementById('level').textContent=e.target.value+'%';SFX.setVolume(0,.8,+e.target.value/100);};
</script></body></html>
