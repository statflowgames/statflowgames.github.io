<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff1dc"><meta name="apple-mobile-web-app-capable" content="yes"><title>햄찌 창고 — 볼이 빵빵!</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=1"></head>
<body><main class="game">
  <header><div class="brand"><span>H</span><div><b>햄찌 창고</b><small>볼이 빵빵!</small></div></div><div class="best"><small>BEST</small><b id="best">0</b></div><button id="sound">♪</button></header>
  <section class="hud"><div><small>볼주머니</small><b><span id="carry">0</span>개</b></div><div class="timer"><small>남은 시간</small><b id="timer">00:45</b></div><div><small>비밀 창고</small><b><span id="bank">0</span>점</b></div><div class="hearts" id="hearts">♥♥♥</div></section>
  <section class="arena"><canvas id="canvas" aria-label="햄찌 창고 게임 화면"></canvas><div id="toast" class="toast"></div><div id="combo" class="combo"></div></section>
  <section class="controls"><div class="guide"><span>☝️</span><div><b>좌우로 드래그해 간식 받기</b><small>매운 고추는 피해요!</small></div></div><button id="save" disabled><small>안전하게</small><b>창고에 저장!</b><span id="saveHint">3개부터</span></button></section>
  <footer>STATFLOW GAMES <button id="pause">Ⅱ</button> WEB PROTOTYPE</footer>
</main>
<section id="start" class="layer start active"><div class="bubble b1"></div><div class="bubble b2"></div><img src="icon.svg" class="hero" alt="볼주머니가 빵빵한 햄스터"><p>SNACK · STUFF · SAVE!</p><h1>햄찌 창고</h1><strong>볼이 빵빵!</strong><span>간식을 욕심껏 모으고 고추가 오기 전에 저장해요</span><button id="startButton" class="primary"><b>간식 받으러 가기</b><small>볼주머니 준비 완료!</small><i>→</i></button><div class="steps"><em>🥜 받기</em><em>🌶️ 피하기</em><em>🏠 저장하기</em></div></section>
<section id="result" class="layer result"><div class="card"><div id="resultFace" class="result-face">🐹</div><p>SNACK REPORT</p><h2 id="resultTitle">오늘도 빵빵하게 성공!</h2><span id="resultCopy">창고가 간식으로 가득 찼어요.</span><div class="stats"><div><small>저장 점수</small><b id="resultScore">0</b></div><div><small>최고 기록</small><b id="resultBest">0</b></div></div><button id="retry" class="primary"><b>한 판 더!</b><small>이번엔 더 빵빵하게</small><i>↻</i></button></div></section>
<section id="pauseLayer" class="layer pause"><div><span>💤</span><h2>간식 먹는 중…</h2><button id="resume" class="primary"><b>계속하기</b><small>다시 받아볼까요?</small><i>▶</i></button></div></section>
<script src="game.js?v=1"></script></body></html>
