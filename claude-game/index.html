<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Claude Game</title>
  <meta name="theme-color" content="#120d16" />
  <link rel="icon" href="./minidigger/icon.png" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #120d16; color: #f6efe6; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 26px; margin: 0 0 6px; color: #ffd34d; }
    p.lead { margin: 0 0 24px; color: #b9a9c6; }
    a.card { display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit; background: #231a2b; border: 3px solid #000; border-radius: 16px; padding: 14px; box-shadow: inset 0 0 0 2px #4a3a57; }
    a.card:active { transform: translateY(1px); }
    a.card img { width: 72px; height: 72px; border-radius: 14px; image-rendering: pixelated; flex-shrink: 0; }
    a.card b { font-size: 18px; display: block; }
    a.card span { font-size: 13px; color: #b9a9c6; line-height: 1.4; }
    .play { margin-left: auto; background: linear-gradient(#ffe08a, #ffb02e); color: #2a1606; font-weight: 900; border: 2px solid #000; border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Claude Game</h1>
    <p class="lead">휴대폰 브라우저에서 바로 하는 게임 모음</p>
    <a class="card" href="./minidigger/">
      <img src="./minidigger/icon.png" alt="" />
      <div>
        <b>미니 던전 디거</b>
        <span>땅을 파고 내려가 광물을 모으고, 장비를 강화하고, 5개 지역의 보스를 쓰러뜨리는 채굴 탐험 게임</span>
      </div>
      <div class="play">플레이</div>
    </a>
    <a class="card" href="./sneakycat/" style="margin-top:12px">
      <img src="./sneakycat/img/icon-192.png" alt="" />
      <div>
        <b>도둑 고양이</b>
        <span>집사·경비견·감시 카메라의 눈을 피해 생선을 훔쳐 오는 잠입 퍼즐 게임 (30스테이지)</span>
      </div>
      <div class="play">플레이</div>
    </a>
  </main>
</body>
</html>
