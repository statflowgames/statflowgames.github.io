<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#dff5ff"><meta name="apple-mobile-web-app-capable" content="yes"><title>몽실빵 탑 — 폭신폭신!</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=1"></head><body>
<main class="game"><header><div class="brand"><span>☁</span><div><b>몽실빵 탑</b><small>폭신폭신!</small></div></div><div class="score"><small>HEIGHT</small><b><span id="score">0</span>층</b></div><div class="best"><small>BEST</small><b id="best">0</b></div></header><section class="arena"><canvas id="canvas" aria-label="몽실빵 쌓기 게임"></canvas><div id="toast" class="toast">PERFECT!</div><div id="combo" class="combo"></div></section><section class="tap-zone" id="tapZone"><span>☝️</span><div><b>타이밍에 맞춰 탭!</b><small>빵이 겹치는 만큼 탑이 올라가요</small></div><i>DROP!</i></section><footer>STATFLOW GAMES <button id="pause">Ⅱ</button> WEB PROTOTYPE</footer></main>
<section id="start" class="layer start active"><div class="cloud c1"></div><div class="cloud c2"></div><img class="hero" src="icon.svg" alt="웃는 몽실빵 탑"><p>TAP · STACK · PERFECT!</p><h1>몽실빵 탑</h1><strong>폭신폭신!</strong><span>움직이는 빵을 탭해서 하늘 끝까지 쌓아봐요</span><button id="startButton" class="primary"><b>빵 쌓기 시작!</b><small>퍼펙트 타이밍 도전</small><i>→</i></button><div class="steps"><em>☝️ 한 번 탭</em><em>✨ 퍼펙트</em><em>☁️ 하늘까지</em></div></section>
<section id="result" class="layer result"><div class="card"><div class="result-bread">🍞</div><p>BAKERY REPORT</p><h2 id="resultTitle">몽실탑 완성!</h2><span>조금만 더 정확하면 더 높이 올라갈 수 있어요.</span><div class="stats"><div><small>쌓은 높이</small><b><span id="resultScore">0</span>층</b></div><div><small>최고 기록</small><b><span id="resultBest">0</span>층</b></div></div><button id="retry" class="primary"><b>다시 쌓기!</b><small>이번엔 더 높이</small><i>↻</i></button></div></section>
<section id="pauseLayer" class="layer pause"><div><span>☁️</span><h2>구름 위에서 쉬는 중</h2><button id="resume" class="primary"><b>계속 쌓기</b><small>몽실몽실 출발</small><i>▶</i></button></div></section><script src="game.js?v=1"></script></body></html>
