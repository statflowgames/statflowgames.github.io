<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="주사위 족보를 맞추고 부적을 모아 점수를 폭발시키는 로그라이크">
<title>운수대통 주사위</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%23fff6e2'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23d7263d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div id="app" class="off">
  <header id="top">
    <div id="stage"></div>
    <div class="topR"><div class="money"><span class="coin"></span><b id="money">0</b></div><button id="btnMenu" aria-label="메뉴">☰</button></div>
  </header>
  <section id="goal">
    <div class="row"><span>목표 <b id="target">0</b></span><span>지금 <b id="score">0</b></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="bossRule" hidden></div>
  </section>
  <section id="charms" class="charms"></section>
  <section id="handInfo">
    <div id="handName">&nbsp;</div>
    <div class="calc"><div id="chips" class="box chips">0</div><span class="x">×</span><div id="mult" class="box mult">0</div></div>
    <div id="total"></div>
  </section>
  <section id="tray"></section>
  <div id="hint"></div>
  <section id="counts"><span>기회 <b id="hands">-</b></span><span>다시 굴리기 <b id="rerolls">-</b></span></section>
  <section id="actions"><button id="btnReroll" class="btn blue">🎲 다시 굴리기</button><button id="btnPlay" class="btn red">📜 족보 내기</button></section>
</div>
<div id="layer"></div>
<div id="sheet"></div>
<script src="js/core.js?v=1"></script>
<script src="js/data.js?v=1"></script>
<script src="js/game.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
</body>
</html>
